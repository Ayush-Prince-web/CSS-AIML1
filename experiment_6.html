<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  margin: 0;
  padding: 0;
}

h1 {
  background-color: black;
  color: white;
  text-align: center;
  padding: 40px 0;
  margin: 30px 0;
}

.box {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 30px;
}

.card1 {
  width: 250px;
  background-color: aliceblue;
  border: 2px solid rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  overflow: hidden;
  text-align: center;
  padding: 15px;
}

.card1 img {
  width: 100%;
  height: auto;
  display: block;
  margin: 0 auto 10px;
}

.property h2 {
  font-size: 18px;
  margin: 10px 0 5px;
  text-transform: capitalize;
}

.property p {
  font-size: 14px;
  margin-bottom: 10px;
  color: #333;
}

.₹ {
  color: green;
  font-weight: bold;
  font-size: 16px;
  margin-right: 10px;
}

.cut {
  color: red;
  text-decoration: line-through;
  font-size: 14px;
}

button {
  background-color: blue;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 10px;
  font-weight: bold;
}


    </style>
</head>
<body>
    <h1> ShopEasy</h1>
<div class="box">
    <div class="outer">
        <div class="card1">
        <img src="https://proshop.links.golf/cdn/shop/products/menslogoshirt-green_1024x1024.png?v=1664883723" alt="Plain green T-shirt">
- 



        </div>
        <div class="property">
     <h2>classic cotton T-Shirt</h2>
    <p>Soft breathable cotton. Regular fit . 
        Avsailable in multiple colors.
    </p>
   <span class="₹"> ₹799   </span>
   <span class="cut">₹1,199</span>
      </div>
    <button>Add to cart</button>
    
    </div>
</div>
</body>
</html>
